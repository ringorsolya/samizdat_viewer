<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szamizdat-adatbázis</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --panel2:#faf8f4; --ink:#1f1d1a; --muted:#6b665d; --line:#e2ddd3; --line2:#cfc8bb;
  --accent:#9b2c2c; --accent-ink:#ffffff; --accent-soft:#f6e7e5; --ok:#2f6b3f; --ok-soft:#e5f1e8; --warn:#8a5a00; --warn-soft:#fbf1dc;
  --info:#2b5c8a; --info-soft:#e4eef7; --focus:#c0504d; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --panel:#201f1c; --panel2:#262421; --ink:#ece8e1; --muted:#a39d92; --line:#36332e; --line2:#48443d;
    --accent:#d0605a; --accent-ink:#1b0f0e; --accent-soft:#3a2321; --ok:#7cc08f; --ok-soft:#1f3326; --warn:#e2b45a; --warn-soft:#3a2f17;
    --info:#7fb0de; --info-soft:#1d2c3a; --focus:#e07a74; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#171614; --panel:#201f1c; --panel2:#262421; --ink:#ece8e1; --muted:#a39d92; --line:#36332e; --line2:#48443d;
  --accent:#d0605a; --accent-ink:#1b0f0e; --accent-soft:#3a2321; --ok:#7cc08f; --ok-soft:#1f3326; --warn:#e2b45a; --warn-soft:#3a2f17;
  --info:#7fb0de; --info-soft:#1d2c3a; --focus:#e07a74; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.hidden{display:none!important}
/* fejléc */
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--muted)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav button .cnt{font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:0 6px;margin-left:4px}
.user{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
/* elrendezés */
main{height:calc(100vh - 53px)}
.split{display:grid;grid-template-columns:minmax(260px,340px) 1fr;height:100%}
.side{border-right:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;min-height:0}
.side .tools{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.side .list{overflow:auto;flex:1;padding:4px 0}
.content{overflow:auto;padding:16px 20px 80px;min-width:0}
.page{max-width:1100px;margin:0 auto}
@media (max-width:820px){header{flex-wrap:wrap;gap:8px}nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto}.user{margin-left:auto}main{height:auto}.split{grid-template-columns:1fr;height:auto}.side{max-height:40vh}.content{padding:12px 16px 60px}.reprow{grid-template-columns:1fr!important}nav button{white-space:nowrap}}
/* lista */
.row{display:flex;gap:6px;align-items:baseline;padding:4px 10px;cursor:pointer;border-left:3px solid transparent}
.row:hover{background:var(--panel)}
.row.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.row .sz{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:56px}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tw{font-size:11px;color:var(--muted)}
.lvl{font-size:10px;font-weight:700;border-radius:3px;padding:0 4px;background:var(--line);color:var(--muted)}
.lvl-s{background:var(--info-soft);color:var(--info)} .lvl-m{background:var(--ok-soft);color:var(--ok)} .lvl-b{background:var(--warn-soft);color:var(--warn)}
.ind1{padding-left:22px}.ind2{padding-left:38px}.ind3{padding-left:54px}
.tog{width:14px;display:inline-block;color:var(--muted);font-size:11px}
/* űrlap */
h1{font-size:20px;margin:0 0 4px}
h2{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:13px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.bar .grow{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel);padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
details.blk{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;box-shadow:var(--shadow)}
details.blk>summary{list-style:none;cursor:pointer;padding:9px 14px;font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary::before{content:"▸";transition:transform .15s}
details.blk[open]>summary::before{transform:rotate(90deg)}
details.blk>summary .hint{font-weight:400;letter-spacing:0;text-transform:none;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px 14px;padding:4px 14px 14px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.f label .req{color:var(--accent)}
.f label .q{cursor:help;border:1px solid var(--line2);border-radius:50%;width:14px;height:14px;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:6px 8px;min-width:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
.inh{font-size:11px;color:var(--info)}
.ures{display:inline-flex;gap:2px;margin-left:auto}
.ures button{border:1px solid var(--line2);background:none;border-radius:4px;font-size:10px;padding:0 4px;cursor:pointer;color:var(--muted)}
.ures button.on{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
/* ismétlődő sorok */
.rep{padding:4px 14px 14px}
.reprow{display:grid;gap:8px;align-items:end;padding:8px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--panel2)}
.reprow .x{align-self:start}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:2px 4px 2px 10px;font-size:13px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px}
.badge{font-size:10px;border-radius:3px;padding:0 4px;background:var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.b-szemely{background:var(--info-soft);color:var(--info)} .b-testulet{background:var(--ok-soft);color:var(--ok)} .b-hely{background:var(--warn-soft);color:var(--warn)} .b-fogalom{background:var(--line);color:var(--muted)} .b-esemeny{background:var(--accent-soft);color:var(--accent)}
/* entitásválasztó */
.ep{position:relative}
.ep .dd{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--panel);border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);max-height:280px;overflow:auto;margin-top:2px}
.ep .dd div{padding:5px 8px;cursor:pointer;display:flex;gap:6px;align-items:center}
.ep .dd div.on,.ep .dd div:hover{background:var(--accent-soft)}
.ep .dd .v{font-size:11px;color:var(--muted)}
.ep .dd .new{color:var(--accent);font-weight:600;border-top:1px solid var(--line)}
.ep .chosen{display:flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:6px;padding:5px 8px;background:var(--panel);min-height:33px}
.ep .chosen .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* egyéb */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
pre.marc{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:60vh}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;max-width:90vw}
.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;box-shadow:var(--shadow)}
.toast.err{background:var(--accent);color:var(--accent-ink)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.modal h2{margin-bottom:10px}
.login{max-width:380px;margin:10vh auto;padding:24px}
.login h1{margin-bottom:12px}
.login .f{margin-bottom:10px}
.note{background:var(--info-soft);color:var(--ink);border-radius:6px;padding:8px 10px;font-size:13px}
.warnbox{background:var(--warn-soft);border-radius:6px;padding:8px 10px;font-size:13px}
.qlist .q{border-left:3px solid var(--warn);padding:6px 10px;margin-bottom:8px;background:var(--panel)}
.qlist .q.lezart{border-left-color:var(--ok);opacity:.75}
.wdres{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.wdres .d{flex:1;min-width:0}
.wdres .d .l{font-weight:600}
.wdres .d .s{font-size:12px;color:var(--muted)}
.diff{font-family:var(--mono);font-size:11px;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:3px;padding:0 4px}
</style>
</head>
<body>
<header id="hdr" class="hidden">
  <div class="brand">Szamizdat-adatbázis</div>
  <nav id="nav">
    <button data-v="tetelek">Tételek</button>
    <button data-v="entitasok">Entitások</button>
    <button data-v="ellenorzendo">Ellenőrzendő <span class="cnt hidden" id="ellcnt"></span></button>
    <button data-v="export">Export</button>
    <button data-v="szotarak">Szótárak</button>
    <button data-v="naplo">Napló</button>
    <button data-v="munkatarsak" id="navMt" class="hidden">Munkatársak</button>
  </nav>
  <div class="user"><span id="whoami"></span>
    <button class="btn sm ghost" id="themeBtn" title="Világos/sötét">◐</button>
    <button class="btn sm" id="pwBtn">Jelszó</button>
    <button class="btn sm" id="logoutBtn">Kilépés</button></div>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   MARC-EXPORT (tiszta függvények – a felülettől függetlenül is futtatható)
   ===================================================================== */
/* MARC-BEGIN */
const MARC = (() => {
  const pad = (s, n, c = ' ') => (String(s ?? '') + c.repeat(n)).slice(0, n);
  const yr = d => d ? String(d).slice(0, 4) : null;
  const clean = s => s == null ? null : String(s).replace(/\s*\n\s*/g, ' ').trim() || null;

  // a tétel szülőláncán felfelé örökölt érték
  function eff(db, t, k) {
    let x = t, guard = 0;
    while (x && guard++ < 5) {
      if (x[k] !== null && x[k] !== undefined && x[k] !== '') return x[k];
      x = x.szulo_id ? db.tetel.get(x.szulo_id) : null;
    }
    return null;
  }
  function szk(db, lista, kod) { return db.szotar[lista]?.[kod] || null; }
  function uri(db, entId) {
    const out = [];
    for (const a of (db.az.get(entId) || [])) {
      const s = szk(db, 'azonosito_rendszer', a.rendszer);
      if (!s || !s.leiras) continue;
      const u = s.leiras.replace('{id}', a.ertek);
      out.push([s.marc_kod === '$0' ? '0' : '1', u]);
    }
    return out.sort((a, b) => a[0].localeCompare(b[0]));
  }
  function datum(db, t) {
    const tip = eff(db, t, 'datum_tipus'), k = eff(db, t, 'datum_kezdet'), v = eff(db, t, 'datum_veg');
    const y1 = yr(k), y2 = yr(v);
    if (!tip || tip === 'ismeretlen' || !y1) return ['n', 'uuuu', 'uuuu'];
    if (tip === 'pontos') return ['e', y1, String(k).slice(5, 7) + String(k).slice(8, 10)];
    if (tip === 'tartam') {
      if (t.biblio_szint === 'c') return ['i', y1, y2 || y1];
      return y2 ? ['d', y1, y2] : ['u', y1, 'uuuu'];
    }
    if (tip === 'becsult') return ['q', y1, y2 || y1];
    if (tip === 'intervallum' && y2 && y2 !== y1) return ['q', y1, y2];
    return ['s', y1, '    '];
  }
  function f008(db, t) {
    const fd = String(t.felvitel_datuma || t.letrehozva || '').slice(0, 10);
    const ymd = fd.length === 10 ? fd.slice(2, 4) + fd.slice(5, 7) + fd.slice(8, 10) : '||||||';
    const [dt, d1, d2] = datum(db, t);
    const orsz = szk(db, 'orszag_kod', eff(db, t, 'orszag_kod'))?.marc_kod || 'xx';
    const ny = szk(db, 'nyelv', t.nyelv || eff(db, t, 'nyelv'))?.marc_kod || '|||';
    return ymd + dt + pad(d1, 4) + pad(d2, 4) + pad(orsz, 3) + '|'.repeat(17) + pad(ny, 3) + ' d';
  }
  function nev(db, e, szerep, biz, extra = []) {
    const sf = [['a', e.nev]];
    const sz = szk(db, 'szerep', szerep);
    if (sz) sf.push(['e', sz.cimke + (biz && biz !== 'biztos' ? ` (${biz})` : '')]);
    if (sz?.marc_kod) sf.push(['4', sz.marc_kod]);
    return sf.concat(extra, uri(db, e.id));
  }
  function felszin(db, t) {   // a tétel közvetlen szülő-periodikája / kötete
    return t.szulo_id ? db.tetel.get(t.szulo_id) : null;
  }
  function gyoker(db, t) { let x = t; while (x && x.szulo_id) x = db.tetel.get(x.szulo_id); return x; }

  function rekord(db, t) {
    const F = [];
    const cf = (tag, value) => F.push({ tag, value });
    const df = (tag, i1, i2, sf) => { sf = sf.filter(s => s[1] !== null && s[1] !== undefined && s[1] !== ''); if (sf.length) F.push({ tag, ind1: i1, ind2: i2, sf }); };
    const szulo = felszin(db, t);
    const gazda = t.biblio_szint === 'a' ? (szulo?.biblio_szint === 'b' ? gyoker(db, t) : szulo) : null;
    // Leader
    const tt = eff(db, t, 'tartalom_tipus');
    const l06 = tt === 'állókép' ? 'k' : tt === 'kotta' ? 'c' : 'a';
    const l07 = t.biblio_szint === 'a' ? (szulo?.biblio_szint === 'b' || szulo?.biblio_szint === 's' ? 'b' : 'a') : t.biblio_szint;
    const leader = '00000n' + l06 + l07 + ' a2200000' + (t.ellenorizve ? ' ' : '5') + 'c 4500';
    cf('001', t.sorszam);
    const mod = String(t.modositva || t.letrehozva || '').replace(/[^0-9]/g, '').slice(0, 14);
    if (mod.length === 14) cf('005', mod + '.0');
    cf('008', f008(db, t));
    df('040', ' ', ' ', [['b', 'hun'], ['e', 'rda']]);
    const ny = szk(db, 'nyelv', t.nyelv)?.marc_kod, eny = szk(db, 'nyelv', t.eredeti_nyelv)?.marc_kod;
    if (ny && eny && ny !== eny) df('041', '1', ' ', [['a', ny], ['h', eny]]);

    const koz = db.koz.filter(k => k.tetel_id === t.id).sort((a, b) => (a.sorrend || 0) - (b.sorrend || 0) || a.id - b.id);
    const fo = koz.find(k => k.szerep === 'aut');
    let van1xx = false;
    if (fo) {
      const e = db.ent.get(fo.entitas_id);
      if (e) { df(e.tipus === 'testulet' ? '110' : '100', e.tipus === 'testulet' ? '2' : '1', ' ', nev(db, e, fo.szerep, fo.bizonyossag)); van1xx = true; }
    }
    df('245', van1xx ? '1' : '0', String(t.cim_nemrendezo || 0), [['a', t.cim || (t.evfolyam_szam ? `[${t.evfolyam_szam}]` : null)], ['b', t.alcim], ['c', t.felelossegi_kozles]]);
    if (t.biblio_szint !== 'a') {
      df('264', ' ', '1', [['a', t.kiadas_helye_atirt], ['b', t.kiado_atirt], ['c', t.datum_atirt || t.datum_edtf]]);
    }
    if (t.terjedelem_oldal) df('300', ' ', ' ', [['a', `${t.terjedelem_oldal} oldal`]]);
    const ctype = { 'szöveg': [['text', 'txt']], 'állókép': [['still image', 'sti']], 'vegyes (szöveg + kép)': [['text', 'txt'], ['still image', 'sti']], 'kotta': [['notated music', 'ntm']] }[tt] || [];
    ctype.forEach(([a, b]) => df('336', ' ', ' ', [['a', a], ['b', b], ['2', 'rdacontent']]));
    const media = { unmediated: 'n', computer: 'c', microform: 'h' }, carrier = { volume: 'nc', sheet: 'nb', 'online resource': 'cr', 'microfilm reel': 'hd' };
    const rm = eff(db, t, 'rda_media'), rh = eff(db, t, 'rda_hordozo');
    if (rm) df('337', ' ', ' ', [['a', rm], ['b', media[rm]], ['2', 'rdamedia']]);
    if (rh) df('338', ' ', ' ', [['a', rh], ['b', carrier[rh]], ['2', 'rdacarrier']]);
    const tech = eff(db, t, 'sokszorositasi_technika');
    if (tech) df('340', ' ', ' ', [['d', tech]]);
    if (t.biblio_szint === 's' && t.datum_atirt) df('362', '1', ' ', [['a', `Megjelenés: ${t.datum_atirt}`]]);
    if (t.biblio_szint !== 'a' && t.ar) df('365', ' ', ' ', [['b', t.ar]]);
    if (t.sorozat) df('490', '0', ' ', [['a', t.sorozat]]);
    if (t.rovat) df('500', ' ', ' ', [['a', `Rovat: ${t.rovat}`]]);
    if (t.peldanyszam) df('500', ' ', ' ', [['a', `Példányszám: ${t.peldanyszam}`]]);
    const kik = koz.filter(k => k.kikovetkeztetett).map(k => `${db.ent.get(k.entitas_id)?.nev} (${szk(db, 'szerep', k.szerep)?.cimke || k.szerep}${k.bizonyossag && k.bizonyossag !== 'biztos' ? ', ' + k.bizonyossag : ''})`);
    if (kik.length) df('500', ' ', ' ', [['a', `A kiadványon nem szereplő, külső forrásból megállapított közreműködő: ${kik.join('; ')}`]]);
    if (t.megjegyzes) df('500', ' ', ' ', [['a', clean(t.megjegyzes)]]);
    const hf = t.hozzaferes;
    if (hf) df('506', hf === 'nyilvános' ? '0' : '1', ' ', [['a', hf === 'nyilvános' ? 'Nyilvános' : hf === 'kutatói' ? 'Kutatói hozzáférés' : 'Zárt']]);
    if (t.tartalmi_kivonat) {
      let k = clean(t.tartalmi_kivonat);
      while (new TextEncoder().encode(k).length > 9000) k = k.slice(0, Math.floor(k.length * 0.9)) + ' […]';
      df('520', ' ', ' ', [['a', k]]);
    }
    for (const a of db.atv.filter(x => x.tetel_id === t.id)) {
      const ft = a.forras_tetel_id ? db.tetel.get(a.forras_tetel_id) : null;

function csvExport(db, ts) {
  const nevek = (t, f) => db.koz.filter(k => k.tetel_id === t.id && f(k)).sort((a, b) => a.sorrend - b.sorrend).map(k => db.ent.get(k.entitas_id)?.nev).join('; ');
  const targy = (t, tip) => db.targy.filter(x => x.tetel_id === t.id && x.tipus === tip).sort((a, b) => a.sorrend - b.sorrend).map(x => db.ent.get(x.entitas_id)?.nev + (x.emlitesek ? ' x' + x.emlitesek : '')).join('; ');
  const fej = ['sorszam', 'biblio_szint', 'gazda', 'szam', 'cim', 'alcim', 'rovat', 'kiado', 'kiadas_helye', 'datum', 'datum_edtf', 'datum_kezdet', 'datum_veg', 'oldal', 'terjedelem', 'nyelv', 'eredeti_nyelv', 'mufaj', 'tartalom_tipus', 'technika', 'ar', 'szerzo', 'fordito', 'szerkeszto', 'egyeb_kozremukodo', 'kiado_entitas', 'tartalmi_kivonat', 'kulcsszavak', 'emlitett_szemelyek', 'atvetel', 'orzo_jelzet', 'bizonyossag', 'forras_hivatkozas', 'hozzaferes', 'ellenorizve'];
  const sor = t => {
    const e = k => MARC.eff(db, t, k);
    const sz = t.szulo_id ? db.tetel.get(t.szulo_id) : null; const g = sz?.biblio_szint === 'b' ? db.tetel.get(sz.szulo_id) : sz;
    return [t.sorszam, t.biblio_szint, g?.cim, sz?.biblio_szint === 'b' ? sz.evfolyam_szam : '', t.cim, t.alcim, t.rovat, e('kiado_atirt'), e('kiadas_helye_atirt'), e('datum_atirt'), e('datum_edtf'), e('datum_kezdet'), e('datum_veg'), t.oldal_pozicio, t.terjedelem_oldal, t.nyelv, t.eredeti_nyelv, t.mufaj, e('tartalom_tipus'), e('sokszorositasi_technika'), e('ar'),
      nevek(t, k => k.szerep === 'aut'), nevek(t, k => k.szerep === 'trl'), nevek(t, k => k.szerep === 'edt'), db.koz.filter(k => k.tetel_id === t.id && !['aut', 'trl', 'edt', 'pbl'].includes(k.szerep)).map(k => `${k.szerep}: ${db.ent.get(k.entitas_id)?.nev}`).join('; '),
      nevek(t, k => k.szerep === 'pbl'), t.tartalmi_kivonat, targy(t, 'kulcsszo'), targy(t, 'emlitett'),
      db.atv.filter(a => a.tetel_id === t.id).map(a => [a.atvetel_tipus, a.forras_leiras].filter(Boolean).join(': ')).join(' | '),
      db.pld.filter(p => p.tetel_id === t.id).map(p => [db.ent.get(p.orzo_id)?.nev, p.jelzet].filter(Boolean).join(' ')).join(' | '),
      t.bizonyossag, t.forras_hivatkozas, t.hozzaferes, t.ellenorizve ? 'igen' : 'nem'];
  };
  const q = v => { v = v == null ? '' : String(v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [fej, ...ts.map(sor)].map(r => r.map(q).join(';')).join('\r\n');
}
